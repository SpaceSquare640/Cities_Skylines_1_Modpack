name: APTP cloud compile test
# Signature: OpenAI-Codex_Responsible: Automated_Public_Transport_Planning
on:
  workflow_dispatch:
  push:
    branches: [Automated_Public_Transport_Planning]
permissions:
  contents: read
jobs:
  compile:
    if: github.ref == 'refs/heads/Automated_Public_Transport_Planning'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned encrypted references and restore helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7b8a5e7c10f2db84388e8dd8af2084f239957b13
          path: build-dependencies
          persist-credentials: false
          sparse-checkout: |
            build-references/cs1/v1
            tools/build-references
      - name: Restore authenticated game references
        shell: pwsh
        env:
          CS1_GAME_REFERENCES_KEY: ${{ secrets.CS1_GAME_REFERENCES_KEY }}
        run: |
          $gameRoot = Join-Path $env:RUNNER_TEMP 'cs1-game-root'
          & ./build-dependencies/tools/build-references/Restore-GameReferences.ps1 -BundleDirectory ./build-dependencies/build-references/cs1/v1 -GameRoot $gameRoot
          "CS1_GAME_ROOT=$gameRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Locate Visual Studio MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'Visual Studio MSBuild was not found.' }
          & $msbuild -version -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "APTP_MSBUILD=$msbuild" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Rebuild Development DLL against verified game references
        shell: pwsh
        run: |
          $gameRoot = $env:CS1_GAME_ROOT
          & $env:APTP_MSBUILD AutomatedPublicTransportPlanning.csproj /t:Rebuild /p:Configuration=Release /p:DevTools=true /p:ModsDir= "/p:CitiesSkylinesDir=$gameRoot" "/p:CSInstallPath=$gameRoot" /verbosity:normal /nologo
          exit $LASTEXITCODE
      - name: Assert compiled module outputs
        shell: pwsh
        run: |
          foreach ($name in @('AutomatedPublicTransportPlanning.dll', 'AutomatedPublicTransportPlanning.pdb')) {
            $file = Get-Item -LiteralPath (Join-Path 'bin/Release' $name) -ErrorAction Stop
            if ($file.Length -le 0) { throw "Compiled output is empty: $name" }
            Write-Host "$name exists and is nonempty ($($file.Length) bytes)."
          }
      # Signature: OpenAI-Codex_Responsible: Automated_Public_Transport_Planning
      - name: Build existing planning engine checks
        shell: pwsh
        run: |
          $checksOutput = Join-Path $env:RUNNER_TEMP 'aptp-planning-checks'
          & $env:APTP_MSBUILD Tests/PlanningEngineChecks.csproj "/p:OutputPath=$checksOutput/" /t:Rebuild /p:Configuration=Release /p:ModsDir= "/p:CitiesSkylinesDir=$env:CS1_GAME_ROOT" /verbosity:normal /nologo
          exit $LASTEXITCODE
      - name: Run pure-data planning checks under cloud CLR v4
        shell: pwsh
        run: |
          # This is a cloud test host, not the game's Mono runtime or in-game acceptance.
          $exe = Join-Path $env:RUNNER_TEMP 'aptp-planning-checks/PlanningEngineChecks.exe'
          '<configuration><startup useLegacyV2RuntimeActivationPolicy="true"><supportedRuntime version="v4.0" /></startup></configuration>' | Set-Content -LiteralPath "$exe.config" -Encoding utf8
          & $exe
          exit $LASTEXITCODE
      - name: Prepare whitelisted public assets
        shell: pwsh
        run: ./.github/scripts/Prepare-Release.ps1
      - name: Transfer only public assets
        uses: actions/upload-artifact@v4
        with:
          name: aptp-public-assets
          path: ${{ runner.temp }}/aptp-release-assets/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aptp-public-assets
          path: release-assets
      - name: Create draft, verify uploaded assets, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/Publish-Release.py

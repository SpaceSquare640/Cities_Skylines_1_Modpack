name: AI Improve Development build and prerelease
on:
  workflow_dispatch:
  push:
    branches: [AI_Improve]
permissions:
  contents: read
jobs:
  compile:
    if: github.repository == 'SpaceSquare640/Cities_Skylines_1_Modpack' && github.ref == 'refs/heads/AI_Improve'
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out encrypted build references
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7b8a5e7c10f2db84388e8dd8af2084f239957b13
          path: build-dependencies
          sparse-checkout: |
            build-references/cs1/v1
            tools/build-references
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore verified game references
        shell: pwsh
        env:
          CS1_GAME_REFERENCES_KEY: ${{ secrets.CS1_GAME_REFERENCES_KEY }}
        run: |
          $gameRoot = Join-Path $env:RUNNER_TEMP 'cs1-game-root'
          & ./build-dependencies/tools/build-references/Restore-GameReferences.ps1 -BundleDirectory ./build-dependencies/build-references/cs1/v1 -GameRoot $gameRoot
          "CS1_GAME_ROOT=$gameRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Development DLL and verify outputs
        shell: pwsh
        run: |
          $modsOutput = Join-Path $env:RUNNER_TEMP 'ai-improve-mods-output'
          New-Item -ItemType Directory -Force -Path $modsOutput | Out-Null
          dotnet --info
          dotnet build AIImprove.csproj --configuration Release --no-incremental -p:DevTools=true "-p:CSInstallPath=$env:CS1_GAME_ROOT" "-p:CitiesSkylinesDir=$env:CS1_GAME_ROOT" "-p:CSDataPath=$modsOutput"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in @('bin/Release/AIImprove.dll', 'bin/Release/CitiesHarmony.API.dll', (Join-Path $modsOutput 'AIImprove.dll'))) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "Required build output missing or empty: $path"
            }
          }
          Write-Output 'Verified nonempty AIImprove.dll, CitiesHarmony.API.dll and temporary deployment DLL.'
      - name: Prepare allowlisted release files
        shell: pwsh
        run: ./tools/Prepare-DevelopmentRelease.ps1 -OutputDirectory '${{ runner.temp }}/ai-improve-release'
      - name: Transfer only allowlisted release files
        uses: actions/upload-artifact@v4
        with:
          name: ai-improve-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-improve-release/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: compile
    if: github.repository == 'SpaceSquare640/Cities_Skylines_1_Modpack' && github.ref == 'refs/heads/AI_Improve'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out publisher only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools
      - name: Receive allowlisted release files
        uses: actions/download-artifact@v4
        with:
          name: ai-improve-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-improve-release
      - name: Verify draft assets and publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-DevelopmentRelease.ps1 -AssetDirectory '${{ runner.temp }}/ai-improve-release'
# Signature: OpenAI-Codex_Responsible: AI_Improve

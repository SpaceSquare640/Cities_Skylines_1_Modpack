name: AI Gaming Development release
# Signature: OpenAI-Codex_Responsible: AI_Gaming
on:
  workflow_dispatch:
  push:
    branches: [AI_Gaming]
permissions:
  contents: read
jobs:
  compile:
    # Signature: OpenAI-Codex_release_format_audit
    outputs:
      artifact-id: ${{ steps.public-assets.outputs.artifact-id }}
      build-attempt: ${{ steps.build-identity.outputs.attempt }}
    if: github.ref == 'refs/heads/AI_Gaming'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record successful build identity
        id: build-identity
        shell: pwsh
        run: '"attempt=$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT'
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 7b8a5e7c10f2db84388e8dd8af2084f239957b13
          path: build-dependencies
          persist-credentials: false
          sparse-checkout: |
            build-references/cs1/v1
            tools/build-references
      - name: Restore approved game references
        env:
          CS1_GAME_REFERENCES_KEY: ${{ secrets.CS1_GAME_REFERENCES_KEY }}
        run: |
          $gameRoot = Join-Path $env:RUNNER_TEMP 'cs1-game-root'
          & ./build-dependencies/tools/build-references/Restore-GameReferences.ps1 -BundleDirectory ./build-dependencies/build-references/cs1/v1 -GameRoot $gameRoot
          "CS1_GAME_ROOT=$gameRoot" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run request preview, text viewport and Companion checks
        run: |
          $checks = @('LoggingChecks/LoggingChecks.csproj', 'Companion/Checks/AIGaming.Companion.Checks.csproj')
          for ($i = 0; $i -lt $checks.Count; $i++) {
            $root = Join-Path $env:RUNNER_TEMP "checks-$i"
            $bin = (Join-Path $root 'bin') + [IO.Path]::DirectorySeparatorChar
            $obj = (Join-Path $root 'obj') + [IO.Path]::DirectorySeparatorChar
            dotnet run --project $checks[$i] -c Release "-p:BaseOutputPath=$bin" "-p:BaseIntermediateOutputPath=$obj" "-p:MSBuildProjectExtensionsPath=$obj"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Validate pairing and publish development Companion
        run: |
          [xml]$mod = Get-Content AIGaming.csproj
          [xml]$companion = Get-Content Companion/AIGaming.Companion.csproj
          $version = [string]$mod.Project.PropertyGroup.Version
          $protocol = $mod.SelectSingleNode('//CompanionProtocolVersion').InnerText
          if ($version -ne [string]$companion.Project.PropertyGroup.Version) { throw 'Version mismatch' }
          if ($protocol -ne $companion.SelectSingleNode('//CompanionProtocolVersion').InnerText) { throw 'Protocol mismatch' }
          if ($protocol -notmatch '^[1-9][0-9]*$') { throw 'Invalid protocol format' }
          $companionBin = (Join-Path $env:RUNNER_TEMP 'companion-bin') + [IO.Path]::DirectorySeparatorChar
          $companionObj = (Join-Path $env:RUNNER_TEMP 'companion-obj') + [IO.Path]::DirectorySeparatorChar
          $output = Join-Path $env:RUNNER_TEMP 'companion-development'
          dotnet --info
          dotnet publish Companion/AIGaming.Companion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:CompanionEdition=development "-p:Version=$version" "-p:CompanionProtocolVersion=$protocol" "-p:BaseOutputPath=$companionBin" "-p:BaseIntermediateOutputPath=$companionObj" "-p:MSBuildProjectExtensionsPath=$companionObj" -o $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path Companion/bin) { throw 'Companion/bin polluted checkout' }
          if (Test-Path Companion/obj) { throw 'Companion/obj polluted checkout' }
          $exe = Join-Path $output 'AIGaming.Companion.exe'
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "PAIR_VERSION=$version" >> $env:GITHUB_ENV
          "PAIR_PROTOCOL=$protocol" >> $env:GITHUB_ENV
          "PAIR_SHA256=$sha" >> $env:GITHUB_ENV
          "Companion published: edition=development version=$version protocol=$protocol SHA256=$sha" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Compile development DLL with approved game references
        run: |
          $gameRoot = $env:CS1_GAME_ROOT
          $modOutput = Join-Path $env:RUNNER_TEMP 'mod-development'
          dotnet build AIGaming.csproj -c Release -p:DevTools=true -p:CompanionEdition=development "-p:CompanionVersion=$env:PAIR_VERSION" "-p:CompanionProtocolVersion=$env:PAIR_PROTOCOL" "-p:CompanionSha256=$env:PAIR_SHA256" "-p:CSInstallPath=$gameRoot" "-p:CitiesSkylinesDir=$gameRoot" -o $modOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = Get-Item -LiteralPath (Join-Path $modOutput 'AIGaming.dll')
          $exe = Get-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'companion-development/AIGaming.Companion.exe')
          if ($dll.Length -le 0 -or $exe.Length -le 0) { throw 'Empty paired build output' }
          "Verified nonempty mod DLL ($($dll.Length) bytes) and paired Companion ($($exe.Length) bytes)." >> $env:GITHUB_STEP_SUMMARY
      - name: Check cancellation against the compiled module
        run: |
          $env:AIGAMING_MODULE_PATH = Join-Path $env:RUNNER_TEMP 'mod-development/AIGaming.dll'
          $bin = (Join-Path $env:RUNNER_TEMP 'checks-1/bin') + [IO.Path]::DirectorySeparatorChar
          $obj = (Join-Path $env:RUNNER_TEMP 'checks-1/obj') + [IO.Path]::DirectorySeparatorChar
          dotnet run --project Companion/Checks/AIGaming.Companion.Checks.csproj -c Release "-p:BaseOutputPath=$bin" "-p:BaseIntermediateOutputPath=$obj" "-p:MSBuildProjectExtensionsPath=$obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare allowlisted release assets
        run: ./tools/release/Prepare-Assets.ps1
      - uses: actions/upload-artifact@v4
        id: public-assets
        with:
          name: ai-gaming-release-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/release-assets/AIGaming.dll
            ${{ runner.temp }}/release-assets/AIGaming.Companion.exe
            ${{ runner.temp }}/release-assets/README.md
            ${{ runner.temp }}/release-assets/LICENSE
            ${{ runner.temp }}/release-assets/Steam_Workshop_Link.txt
            ${{ runner.temp }}/release-assets/DOTNET-LICENSE.txt
            ${{ runner.temp }}/release-assets/DOTNET-THIRD-PARTY-NOTICES.txt
            ${{ runner.temp }}/release-assets/build-info.json
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt
  publish:
    needs: compile
    if: github.ref == 'refs/heads/AI_Gaming'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.compile.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - name: Verify assets and retain unpublished prerelease draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD_ATTEMPT: ${{ needs.compile.outputs.build-attempt }}
        run: ./tools/release/Publish-Assets.ps1

name: AI Improve cloud compile test
on:
  workflow_dispatch:
  push:
    branches: [AI_Improve]
    paths:
      - .github/workflows/cloud-compile-test.yml
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Diagnose Development DLL compilation
        shell: pwsh
        run: |
          $gameRoot = Join-Path $env:RUNNER_TEMP 'ai-improve-game-root'
          $modsOutput = Join-Path $env:RUNNER_TEMP 'ai-improve-mods-output'
          New-Item -ItemType Directory -Force -Path $gameRoot, $modsOutput | Out-Null
          dotnet --info
          dotnet build AIImprove.csproj --configuration Release --no-incremental -p:DevTools=true "-p:CSInstallPath=$gameRoot" "-p:CitiesSkylinesDir=$gameRoot" "-p:CSDataPath=$modsOutput"
          exit $LASTEXITCODE
# Signature: OpenAI-Codex_Responsible: AI_Improve

name: "Automated Public Transport Planning: Release Version upload"

# Release items are built with DevTools=false and need the workshop-release approval.
# Upload-Mod.ps1 decides the DevTools setting from the edition and rejects any other item ID.

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: Confirm updating the existing Automated Public Transport Planning Release Version item
        type: choice
        options:
          - DO NOT UPLOAD
          - UPLOAD EXISTING ITEM
        default: DO NOT UPLOAD
        required: true
      source_ref:
        description: Commit SHA on the module branch to release (use the commit already tested on the Development item)
        type: string
        required: true
        default: Automated_Public_Transport_Planning
      published_file_id:
        description: Workshop item ID for Automated Public Transport Planning Release Version (must match the ID registered in Upload-Mod.ps1)
        type: string
        required: true
        default: "3823739383"
      preview_file_name:
        description: Preview filename inside Resource/Icon/Uses_icon/JPG/
        type: string
        required: true
        default: Cities_Skylines_1_Automated_Public_Transport_Planning_Release_Version.jpg
      change_note:
        description: Optional Workshop change note
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: steam-workshop-transport-release
  cancel-in-progress: false

jobs:
  release-gate-not-ready:
    if: github.repository == 'SpaceSquare640/Cities_Skylines_1_Modpack' && vars.WORKSHOP_RELEASE_APPROVAL_READY != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Stop until the release approval gate exists
        shell: bash
        run: |
          echo "::error::Release uploads are disabled until the workshop-release environment with a required reviewer exists and WORKSHOP_RELEASE_APPROVAL_READY is set to true."
          exit 1
  upload:
    if: github.repository == 'SpaceSquare640/Cities_Skylines_1_Modpack' && vars.WORKSHOP_RELEASE_APPROVAL_READY == 'true'
    runs-on: [self-hosted, Windows, X64, cs1-workshop]
    environment: workshop-release
    timeout-minutes: 60
    steps:
      - name: Check out the default-branch uploader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Modpack_Website
          path: orchestrator
          persist-credentials: false
      - name: Check out Automated Public Transport Planning branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: Automated_Public_Transport_Planning
          path: mod-source
          fetch-depth: 0
          persist-credentials: false
      - name: Select the source commit on the module branch
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\mod-source"
          if ($env:SOURCE_REF -notmatch '^[A-Za-z0-9._/-]{1,100}$') { throw 'source_ref contains unsupported characters.' }
          $sha = git rev-parse --verify "$($env:SOURCE_REF)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "source_ref $($env:SOURCE_REF) is not a commit in this repository." }
          git merge-base --is-ancestor $sha HEAD
          if ($LASTEXITCODE -ne 0) { throw "Commit $sha is not on the Automated_Public_Transport_Planning branch." }
          git checkout --quiet --detach $sha
          Write-Output "Building Automated Public Transport Planning Release Version from $sha"
      - name: Build and submit Release Version
        shell: pwsh
        env:
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
          PUBLISHED_FILE_ID: ${{ inputs.published_file_id }}
          PREVIEW_FILE_NAME: ${{ inputs.preview_file_name }}
          CHANGE_NOTE: ${{ inputs.change_note }}
        run: |
          & "$env:GITHUB_WORKSPACE\orchestrator\tools\steam-workshop\Upload-Mod.ps1" -Module "Automated_Public_Transport_Planning" -Edition "Release" -SourcePath "$env:GITHUB_WORKSPACE\mod-source" -PublishedFileId $env:PUBLISHED_FILE_ID -PreviewFileName $env:PREVIEW_FILE_NAME -ChangeNote $env:CHANGE_NOTE -ConfirmUpload $env:CONFIRM_UPLOAD

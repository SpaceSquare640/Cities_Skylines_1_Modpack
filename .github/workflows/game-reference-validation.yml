name: Encrypted game reference validation
# Signature: OpenAI-Codex
on:
  workflow_dispatch:
  push:
    branches: [Modpack_Website]
    paths:
      - build-references/cs1/v1/**
      - tools/build-references/**
      - .github/workflows/game-reference-validation.yml
permissions:
  contents: read
jobs:
  verify-references:
    if: github.repository == 'KingsleyHK0323/Cities_Skylines_1_Modpack' && github.ref == 'refs/heads/Modpack_Website'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate and verify private build references
        shell: pwsh
        env:
          CS1_GAME_REFERENCES_KEY: ${{ secrets.CS1_GAME_REFERENCES_KEY }}
        run: |
          & ./tools/build-references/Restore-GameReferences.ps1 -BundleDirectory ./build-references/cs1/v1 -GameRoot (Join-Path $env:RUNNER_TEMP 'cs1-reference-validation')

# Author: OpenAI-Codex_Responsible: Modpack_Website.

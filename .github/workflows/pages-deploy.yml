name: "Website: build and deploy to GitHub Pages"

# Builds the Astro + Starlight site in site/ and publishes it as the GitHub Pages site.
# Runs on GitHub-hosted runners only; it needs no game files or secrets.

on:
  push:
    branches:
      - Modpack_Website
    paths:
      - "site/**"
      - "Change Log.md"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'KingsleyHK0323/Cities_Skylines_1_Modpack'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the website branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        working-directory: site
        run: npm ci
      - name: Build the site
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

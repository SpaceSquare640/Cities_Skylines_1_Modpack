# Signature: OpenAI-Codex_Responsible: Realistic_City_Time
name: Realistic City Time foundation

on:
  push:
    branches: [Realistic_City_Time]
  pull_request:
    branches: [Realistic_City_Time]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'Realistic_City_Time') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/Realistic_City_Time')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out foundation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify foundation documents
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s 'Change Log.md'
          test -s LICENSE
          grep -Fq 'No game functionality' README.md
          grep -Fq 'default speed is 1x and the maximum is 10x' README.md
          grep -Fq 'source-available' README.md
          grep -Fq 'CC BY-NC-SA 4.0' README.md
          printf '%s  LICENSE\n' 'ffcca38841adb694b6f380647e15f17c446a4d1656fed51a1e2041d064c94cc8' | sha256sum --check

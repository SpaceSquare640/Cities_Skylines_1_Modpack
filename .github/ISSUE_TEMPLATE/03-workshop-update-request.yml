name: Steam Workshop update request
description: Request review of an update to an existing Workshop item. This form does not trigger an upload.
title: "[Workshop update]: "
body:
  - type: markdown
    attributes:
      value: |
        This form records an update request only. It does not start a workflow or authorize an upload. A maintainer must review and approve any upload. Never include Steam passwords, Steam Guard codes, API keys, or other credentials.
  - type: dropdown
    id: project
    attributes:
      label: Mod
      options:
        - AI Improve
        - Automated Public Transport Planning
        - AI Gaming
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Workshop edition
      options:
        - Release Version
        - Development Version
    validations:
      required: true
  - type: input
    id: workshop_item
    attributes:
      label: Existing Workshop item URL or ID
      description: Provide the existing item if known. A valid existing item ID is required before an upload can be considered; new-item creation is not requested by this form.
      placeholder: "https://steamcommunity.com/sharedfiles/filedetails/?id=..."
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Source selection follows the current HEAD of the selected mod's branch. AI Improve and Automated Public Transport Planning Release and Development editions currently use the same Release build configuration; DevTools remains disabled.
  - type: textarea
    id: change_note
    attributes:
      label: Proposed Workshop change note
      description: Summarize the changes that should appear in the Workshop update.
    validations:
      required: true
  - type: textarea
    id: source_details
    attributes:
      label: Source commit or release context
      description: Optionally provide a commit SHA, release reference, or explanation of what should be reviewed.
    validations:
      required: false
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand this is a request for maintainer review only; creating this issue does not trigger or authorize an upload.
          required: true
# Author: OpenAI-Codex.
